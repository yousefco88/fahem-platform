<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فاهم — بدون اتصال</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #f1f5f9;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #fff;
    }
    p {
      font-size: 16px;
      color: #94a3b8;
      margin-bottom: 32px;
      line-height: 1.6;
    }
    .tips {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
      text-align: right;
      margin-bottom: 24px;
    }
    .tips h3 {
      font-size: 14px;
      color: #f97316;
      margin-bottom: 12px;
    }
    .tips ul {
      list-style: none;
      font-size: 14px;
      color: #cbd5e1;
    }
    .tips li {
      padding: 6px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tips li::before {
      content: '✓';
      color: #10b981;
    }
    button {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
    }
    button:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>بدون اتصال بالإنترنت</h1>
    <p>يبدو أن الاتصال بالإنترنت انقطع. لا تقلق، المحتوى المحفوظ متاح!</p>
    
    <div class="tips">
      <h3>💡 نصائح</h3>
      <ul>
        <li>تحقق من اتصالك بالواي فاي</li>
        <li>جرب تشغيل/إيقاف وضع الطيران</li>
        <li>الدروس المحملة تعمل بدون إنترنت</li>
      </ul>
    </div>
    
    <button onclick="location.reload()">
      🔄 إعادة المحاولة
    </button>
  </div>
</body>
</html>
